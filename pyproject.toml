[build-system]
requires = ["setuptools>=64.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hailo-apps"
version = "26.03.0"
description = "Hailo AI applications and pipelines package"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Hailo" },
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
]
dependencies = [
    # Core dependencies
    "numpy",
    "setproctitle",
    "opencv-python<=4.10.0.84",  # Pin to avoid Qt font warnings in newer versions
    "python-dotenv",
    "pyyaml",
    "Pillow",
    "lancedb",
    "tokenizers",

    # Dependencies from hace-internal (tracker, etc.)
    "loguru",
    "scipy>=1.9.3",
    "lap",
    "cython_bbox",
    "tqdm",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.5.7",
    "pre-commit>=3.7.0",
    "pytest>=7.0.0",
    "pytest-timeout>=2.0.0",
]

[project.urls]
Homepage = "https://github.com/hailo-ai/hailo-apps"
Repository = "https://github.com/hailo-ai/hailo-apps"
Issues = "https://github.com/hailo-ai/hailo-apps/issues"

[project.scripts]
get-usb-camera =            "hailo_apps.python.core.common.camera_utils:main"
hailo-post-install =        "hailo_apps.installation.post_install:main"
hailo-set-env =             "hailo_apps.installation.set_env:main"
hailo-download-resources =  "hailo_apps.installation.download_resources:main"
hailo-magic-mirror =        "hailo_apps.python.pipeline_apps.magic_mirror.magic_mirror:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
# Package sources live under the hailo/ subdirectory.
where = ["hailo"]
include = ["hailo_apps*", "local_resources*"]

[tool.setuptools.package-data]
"hailo_apps.postprocess" = [
    "build.release/cpp/*.so",
]
"hailo_apps.config" = [
    "*.yaml",
    "*.json",
]
"local_resources" = [
    "**/*",
]

[tool.ruff]
target-version = "py310"
line-length = 100
exclude = [
    ".git", ".hg", ".mypy_cache", ".ruff_cache", ".venv", "venv", "build", "dist",
    "__pycache__", "site-packages",
    "hailo/hailo_apps/**/resources/**",
    "hailo/hailo_apps/**/cpp/**",
]

[tool.pytest.ini_options]
testpaths = ["hailo/tests"]
addopts = "-ra --tb=short"
markers = [
    "sanity: Quick environment sanity checks",
    "installation: Installation validation tests",
    "resources: Resource file validation tests",
    "requires_device: Tests requiring a Hailo device",
    "requires_gstreamer: Tests requiring GStreamer",
    "pipeline: GStreamer pipeline functional tests",
    "standalone: Standalone app smoke tests",
    "genai: Generative AI app tests",
]

[tool.ruff.format]
indent-style = "space"
quote-style = "double"
line-ending = "lf"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "B",
    "UP",
    "C4",
    "W",
    "RUF",
]
ignore = [
    "E402",
    "F403",
    "F405",
    "E501",
]

[tool.ruff.lint.isort]
combine-as-imports = true
known-first-party = ["hailo_apps"]
